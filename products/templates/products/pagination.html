{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Páginas de productos">
    {% if page_obj.has_previous %}<a class="button button-secondary" href="?{{ pagination_query }}&amp;page={{ page_obj.previous_page_number }}#cards">← Anterior</a>{% endif %}
    <span aria-current="page">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="button button-secondary" href="?{{ pagination_query }}&amp;page={{ page_obj.next_page_number }}#cards">Siguiente →</a>{% endif %}
</nav>
{% endif %}
